\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;height:24px\">\n        <span style=\"font-size:13px;color:#6e6e73\">US master · source<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:24px;padding:40px;border:1px solid #e8e8ed;border-radius:20px;font-family:'Newsreader',Georgia,serif\">\n        <p style=\"margin:0;font-size:28px;line-height:1.2;text-wrap:balance;color:#6e6e73\">{{ master.headline }}<\u002Fp>\n        <p style=\"margin:0;font-size:18px;line-height:1.4;text-wrap:pretty;color:#6e6e73\">{{ master.body }}<\u002Fp>\n        <p style=\"margin:0;font-size:18px;color:#6e6e73\">{{ master.cta }}<\u002Fp>\n        <p style=\"margin:0;font-size:16px;color:#6e6e73\">{{ master.legal }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;gap:16px;align-content:start\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;height:24px\">\n        <span style=\"font-size:13px;color:#6e6e73\">{{ rv.name }} variant<\u002Fspan>\n        <span style=\"font-size:13px;color:#1d1d1f\">{{ rv.prov }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ rv.showCopy }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;gap:24px;padding:40px;border:{{ rv.surfaceBorder }};border-radius:20px;background:{{ rv.surface }};font-family:'Newsreader',Georgia,serif;transition:background 200ms ease-out\">\n          <p style=\"margin:0;font-size:28px;line-height:1.2;text-wrap:balance\"><sc-for list=\"{{ rv.headline }}\" as=\"sg\"><sc-if value=\"{{ sg.isPlain }}\"><span>{{ sg.t }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sg.isChange }}\"><span role=\"button\" tabindex=\"0\" aria-pressed=\"{{ sg.pressed }}\" sc-camel-on-click=\"{{ sg.pick }}\" sc-camel-on-key-down=\"{{ sg.key }}\" style=\"background:{{ sg.bg }};color:{{ sg.fg }};border-bottom:1px solid #1d1d1f;padding:1px 3px;border-radius:4px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background 150ms ease-out\">{{ sg.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fp>\n          <p style=\"margin:0;font-size:18px;line-height:1.4;text-wrap:pretty\"><sc-for list=\"{{ rv.body }}\" as=\"sg\"><sc-if value=\"{{ sg.isPlain }}\"><span>{{ sg.t }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sg.isChange }}\"><span role=\"button\" tabindex=\"0\" aria-pressed=\"{{ sg.pressed }}\" sc-camel-on-click=\"{{ sg.pick }}\" sc-camel-on-key-down=\"{{ sg.key }}\" style=\"background:{{ sg.bg }};color:{{ sg.fg }};border-bottom:1px solid #1d1d1f;padding:1px 3px;border-radius:4px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background 150ms ease-out\">{{ sg.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fp>\n          <p style=\"margin:0;font-size:18px\"><sc-for list=\"{{ rv.cta }}\" as=\"sg\"><sc-if value=\"{{ sg.isPlain }}\"><span>{{ sg.t }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ sg.isChange }}\"><span role=\"button\" tabindex=\"0\" aria-pressed=\"{{ sg.pressed }}\" sc-camel-on-click=\"{{ sg.pick }}\" sc-camel-on-key-down=\"{{ sg.key }}\" style=\"background:{{ sg.bg }};color:{{ sg.fg }};border-bottom:1px solid #1d1d1f;padding:1px 3px;border-radius:4px;cursor:pointer;transition:background 150ms ease-out\">{{ sg.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fp>\n          <p style=\"margin:0;font-size:16px\">{{ master.legal }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;color:#6e6e73\">{{ rv.changesLine }}<\u002Fp>\n        <sc-if value=\"{{ rv.hasDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;gap:12px;border-top:1px solid #1d1d1f;padding-top:16px\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\">\n              <span style=\"font-size:13px;color:#6e6e73;font-variant-numeric:tabular-nums\">{{ rv.detail.n }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ rv.closeDetail }}\" style=\"background:none;border:0;padding:0;font-size:13px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Close<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 16px;font-size:16px\">\n              <span style=\"color:#6e6e73\">Was<\u002Fspan><span style=\"font-family:'Newsreader',Georgia,serif;font-size:18px\">{{ rv.detail.was }}<\u002Fspan>\n              <span style=\"color:#6e6e73\">Now<\u002Fspan><span style=\"font-family:'Newsreader',Georgia,serif;font-size:18px\">{{ rv.detail.now }}<\u002Fspan>\n              <span style=\"color:#6e6e73\">Source<\u002Fspan><span>{{ rv.detail.src }}<\u002Fspan>\n              <span><\u002Fspan><span style=\"color:#6e6e73\">{{ rv.detail.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rv.isEdit }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:24px;padding:40px;border:1px solid #d2d2d7;border-radius:20px;background:#ffffff\">\n          <label style=\"display:grid;gap:8px\"><span style=\"font-size:13px;color:#6e6e73\">Headline<\u002Fspan>\n            <textarea rows=\"2\" value=\"{{ edit.headline }}\" sc-camel-on-change=\"{{ edit.onHeadline }}\" style=\"padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-family:'Newsreader',Georgia,serif;font-size:28px;line-height:1.2;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n          <label style=\"display:grid;gap:8px\"><span style=\"font-size:13px;color:#6e6e73\">Body<\u002Fspan>\n            <textarea rows=\"6\" value=\"{{ edit.body }}\" sc-camel-on-change=\"{{ edit.onBody }}\" style=\"padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.4;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n          <label style=\"display:grid;gap:8px\"><span style=\"font-size:13px;color:#6e6e73\">Call to action<\u002Fspan>\n            <input value=\"{{ edit.cta }}\" sc-camel-on-change=\"{{ edit.onCta }}\" style=\"height:52px;padding:0 16px;border:1px solid #d2d2d7;border-radius:12px;font-family:'Newsreader',Georgia,serif;font-size:18px\"><\u002Flabel>\n          <p style=\"margin:0;font-size:16px;font-family:'Newsreader',Georgia,serif;color:#6e6e73\">{{ master.legal }}<\u002Fp>\n          <div style=\"display:flex;gap:24px;align-items:center;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ edit.save }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#424245\" style-active=\"transform:scale(0.98)\">Save edits<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ edit.cancel }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Cancel<\u002Fbutton>\n            <span style=\"font-size:13px;color:#6e6e73\">The legal line stays word for word. Saving marks the scores out of date.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid;gap:16px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\">\n      <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Flags<\u002Fh2>\n      <span style=\"font-size:13px;color:#6e6e73\">{{ rv.flagSummary }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ rv.flags }}\" as=\"fl\" hint-placeholder-count=\"2\">\n      <div style=\"display:grid;grid-template-columns:180px minmax(0,1fr) 280px;gap:32px;border-top:{{ fl.rule }};padding-top:16px;padding-bottom:8px\">\n        <div style=\"display:grid;gap:4px;align-content:start\">\n          <span style=\"font-size:16px;color:{{ fl.sevColor }}\">{{ fl.sev }}<\u002Fspan>\n          <span style=\"font-size:13px;color:{{ fl.stateColor }}\">{{ fl.stateLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:8px;align-content:start;max-width:66ch\">\n          <p style=\"margin:0;font-size:16px;text-wrap:pretty\">{{ fl.text }}<\u002Fp>\n          <p style=\"margin:0;font-size:13px;color:#6e6e73\">Cites {{ fl.cite }}: {{ fl.citeText }}<\u002Fp>\n          <sc-if value=\"{{ fl.hasReason }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:13px;color:#6e6e73\">Reason: {{ fl.reason }}<\u002Fp><\u002Fsc-if>\n          <sc-if value=\"{{ fl.hasChange }}\" hint-placeholder-val=\"{{ false }}\"><div><button sc-camel-on-click=\"{{ fl.showChange }}\" style=\"background:none;border:0;padding:0;font-size:13px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Show in copy<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ fl.dismissing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;gap:8px;padding-top:8px\">\n              <label for=\"{{ fl.inputId }}\" style=\"font-size:16px\">Why dismiss this? Your reason goes in the decision log.<\u002Flabel>\n              <textarea id=\"{{ fl.inputId }}\" rows=\"2\" value=\"{{ fl.dText }}\" sc-camel-on-change=\"{{ fl.onDText }}\" style=\"padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;line-height:1.4;resize:vertical\"><\u002Ftextarea>\n              <div style=\"display:flex;gap:24px;align-items:center\">\n                <sc-if value=\"{{ fl.canConfirm }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ fl.confirmDismiss }}\" style=\"height:48px;padding:0 24px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Dismiss flag<\u002Fbutton><\u002Fsc-if>\n                <sc-if value=\"{{ fl.cannotConfirm }}\" hint-placeholder-val=\"{{ true }}\"><button disabled=\"\" style=\"height:48px;padding:0 24px;background:#e8e8ed;color:#6e6e73;border:1px solid #e8e8ed;border-radius:999px;font-size:16px;cursor:not-allowed\">Dismiss flag<\u002Fbutton><\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ fl.cancelDismiss }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Cancel<\u002Fbutton>\n                <sc-if value=\"{{ fl.cannotConfirm }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:13px;color:#6e6e73\">Add a reason to dismiss.<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:24px;align-items:center;justify-content:flex-end;align-self:start\">\n          <sc-if value=\"{{ fl.showActions }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ fl.ack }}\" style=\"height:48px;padding:0 20px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Acknowledge<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ fl.dismiss }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Dismiss<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ fl.resolved }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ fl.undo }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Undo<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section style=\"display:grid;gap:16px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\">\n      <div style=\"display:flex;gap:16px;align-items:baseline\">\n        <h2 style=\"margin:0;font-size:16px;font-weight:400\">Scores<\u002Fh2>\n        <span style=\"font-size:13px;color:#6e6e73;border:1px solid #d2d2d7;border-radius:999px;padding:2px 10px\">Advisory<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:13px;color:#6e6e73\">Out of 2. Scores never block approval.<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ rv.stale }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:24px;align-items:center;flex-wrap:wrap;border:1px solid #d2d2d7;border-radius:16px;padding:20px 28px\">\n        <p style=\"margin:0;font-size:16px;flex:1 1 360px\">{{ rv.staleText }}<\u002Fp>\n        <sc-if value=\"{{ rv.canRescore }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ rv.rescore }}\" style=\"height:48px;padding:0 20px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;font-variant-numeric:tabular-nums\" style-hover=\"background:#f5f5f7\">{{ rv.rescoreLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rv.rescoring }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:16px;color:#6e6e73\">Rescoring…<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:grid\">\n      <sc-for list=\"{{ rv.scores }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:180px 48px minmax(0,1fr);gap:32px;border-top:1px solid #e8e8ed;padding:10px 0;color:{{ s.color }}\">\n          <span style=\"font-size:13px\">{{ s.name }}<\u002Fspan>\n          <span style=\"font-size:13px;font-variant-numeric:tabular-nums\">{{ s.v }}<\u002Fspan>\n          <span style=\"font-size:13px\">{{ s.reason }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid;gap:16px;border-top:1px solid #1d1d1f;padding-top:32px\">\n    <sc-if value=\"{{ rv.undecided }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\">\n        <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Your decision<\u002Fh2>\n        <span style=\"font-size:13px;color:#6e6e73\">Approve, edit or reject. Nothing is published from here.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px\">\n        <sc-for list=\"{{ rv.decisionBtns }}\" as=\"db\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;gap:8px;align-content:start\">\n            <button sc-camel-on-click=\"{{ db.go }}\" aria-pressed=\"{{ db.pressed }}\" style=\"height:56px;background:{{ db.bg }};color:{{ db.fg }};border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 150ms ease-out,color 150ms ease-out\">{{ db.label }}<\u002Fbutton>\n            <span style=\"font-size:13px;color:{{ db.helpColor }}\">{{ db.help }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ rv.isApprove }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:16px;padding-top:16px;max-width:760px\">\n          <label for=\"cd-name\" style=\"font-size:16px\">Your name<\u002Flabel>\n          <input id=\"cd-name\" value=\"{{ cdName }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Creative director's full name\" style=\"height:52px;padding:0 16px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;max-width:400px\">\n          <div style=\"display:flex;gap:24px;align-items:center;flex-wrap:wrap\">\n            <sc-if value=\"{{ rv.canApprove }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ rv.approve }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#424245\" style-active=\"transform:scale(0.98)\">Confirm approval<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ rv.cannotApprove }}\" hint-placeholder-val=\"{{ true }}\"><button disabled=\"\" style=\"height:48px;padding:0 24px;background:#e8e8ed;color:#6e6e73;border:1px solid #e8e8ed;border-radius:999px;font-size:16px;cursor:not-allowed\">Confirm approval<\u002Fbutton><\u002Fsc-if>\n            <span style=\"font-size:16px;color:{{ rv.approveMsgColor }};max-width:52ch\">{{ rv.approveMsg }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rv.isReject }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:16px;padding-top:16px;max-width:760px\">\n          <label for=\"rej\" style=\"font-size:16px\">Why reject this draft? The reason goes in the decision log.<\u002Flabel>\n          <textarea id=\"rej\" rows=\"3\" value=\"{{ rejectText }}\" sc-camel-on-change=\"{{ onReject }}\" style=\"padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;line-height:1.4;resize:vertical\"><\u002Ftextarea>\n          <div style=\"display:flex;gap:24px;align-items:center\">\n            <sc-if value=\"{{ rv.canReject }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ rv.reject }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#424245\" style-active=\"transform:scale(0.98)\">Confirm rejection<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ rv.cannotReject }}\" hint-placeholder-val=\"{{ true }}\"><button disabled=\"\" style=\"height:48px;padding:0 24px;background:#e8e8ed;color:#6e6e73;border:1px solid #e8e8ed;border-radius:999px;font-size:16px;cursor:not-allowed\">Confirm rejection<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ rv.cannotReject }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:16px;color:#6e6e73\">Add a reason to reject.<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ rv.decided }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n        <div style=\"display:grid;gap:8px\">\n          <p style=\"margin:0;font-size:28px;line-height:1.2\">{{ rv.decisionLine }}<\u002Fp>\n          <sc-if value=\"{{ rv.hasDecisionReason }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:16px;color:#6e6e73\">Reason: {{ rv.decisionReason }}<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:24px;align-items:center\">\n          <button sc-camel-on-click=\"{{ rv.undo }}\" style=\"height:48px;padding:0 24px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Undo, back to Draft<\u002Fbutton>\n          <sc-if value=\"{{ rv.hasNext }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ rv.next }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ rv.nextLabel }}<\u002Fbutton><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ goHandoff }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Go to handoff<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <\u002Fsc-if>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- HANDOFF -->\n<sc-if value=\"{{ isHandoff }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"06 Handoff\" style=\"max-width:1200px;width:100%;margin:0 auto;padding:88px 48px 128px;display:grid;gap:80px\">\n  <div style=\"display:grid;gap:16px\">\n    <h1 style=\"margin:0;font-size:56px;line-height:1.05;font-weight:400;letter-spacing:-0.035em\">Handoff<\u002Fh1>\n    <p style=\"margin:0;font-size:16px;color:#6e6e73\">Only copy a creative director approved appears here. Take it to your usual tools.<\u002Fp>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hoEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;gap:16px;border:1px solid #d2d2d7;border-radius:20px;padding:32px;background:#f5f5f7;border-color:#f5f5f7;max-width:760px\">\n      <p style=\"margin:0;font-size:18px\">Nothing approved yet.<\u002Fp>\n      <p style=\"margin:0;font-size:16px;color:#6e6e73\">Approve a variant in review and its copy appears here, ready to copy or download.<\u002Fp>\n      <div><button sc-camel-on-click=\"{{ goCampaign }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#424245\" style-active=\"transform:scale(0.98)\">Go to campaign review<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-for list=\"{{ hoApproved }}\" as=\"ap\" hint-placeholder-count=\"0\">\n    <section style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:48px\">\n      <div style=\"grid-column:span 4;display:grid;gap:8px;align-content:start\">\n        <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">{{ ap.name }}<\u002Fh2>\n        <span style=\"font-size:13px;color:#6e6e73\">Approved by {{ ap.by }}, {{ ap.at }}<\u002Fspan>\n        <div style=\"display:flex;gap:24px;align-items:center;padding-top:16px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ ap.copy }}\" style=\"height:48px;padding:0 20px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Copy to clipboard<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ ap.download }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Download .txt<\u002Fbutton>\n        <\u002Fdiv>\n        <span role=\"status\" style=\"font-size:13px;color:#6e6e73;min-height:18px\">{{ ap.msg }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 8;display:grid;gap:24px;padding:40px;border:1px solid #d2d2d7;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,0.04),0 8px 24px rgba(0,0,0,0.04);font-family:'Newsreader',Georgia,serif\">\n        <p style=\"margin:0;font-size:28px;line-height:1.2;text-wrap:balance\">{{ ap.headline }}<\u002Fp>\n        <p style=\"margin:0;font-size:18px;line-height:1.4;text-wrap:pretty\">{{ ap.body }}<\u002Fp>\n        <p style=\"margin:0;font-size:18px\">{{ ap.cta }}<\u002Fp>\n        <p style=\"margin:0;font-size:16px\">{{ ap.legal }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n\n  <sc-if value=\"{{ hoHasOthers }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;gap:8px\">\n      <sc-for list=\"{{ hoOthers }}\" as=\"o\" hint-placeholder-count=\"1\">\n        <p style=\"margin:0;font-size:16px;color:#6e6e73\">{{ o.text }}<\u002Fp>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <section style=\"display:grid;gap:16px\">\n    <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Decision log<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:140px 180px 160px 200px minmax(0,1fr);gap:24px;padding-bottom:12px\">\n      <span style=\"font-size:13px;color:#6e6e73\">When<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Who<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Market<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Decision<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Detail<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:16px;color:#6e6e73;border-top:1px solid #e8e8ed;padding-top:16px\">No decisions yet. Every acknowledge, dismiss, edit, approval and rejection lands here with a name and time.<\u002Fp><\u002Fsc-if>\n    <sc-for list=\"{{ logRows }}\" as=\"lg\" hint-placeholder-count=\"3\">\n      <div style=\"display:grid;grid-template-columns:140px 180px 160px 200px minmax(0,1fr);gap:24px;border-top:1px solid #e8e8ed;padding:12px 0\">\n        <span style=\"font-size:16px;font-variant-numeric:tabular-nums;color:#6e6e73\">{{ lg.at }}<\u002Fspan>\n        <span style=\"font-size:16px\">{{ lg.who }}<\u002Fspan>\n        <span style=\"font-size:16px\">{{ lg.market }}<\u002Fspan>\n        <span style=\"font-size:16px\">{{ lg.what }}<\u002Fspan>\n        <span style=\"font-size:16px;color:#6e6e73;text-wrap:pretty\">{{ lg.detail }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showStateBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;runsUsedToday&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nconst CODES = ['za','ng','uk'];\nconst NAMES = {za:'South Africa', ng:'Nigeria', uk:'United Kingdom'};\nconst ACCENT = 'oklch(0.55 0.2 29)';\nconst MASTER = {\n  headline:'The admin is handled. The weekend is yours.',\n  body:\"Kin rebooks the dentist you've dodged since March, chases the refund, and finds a time that works for the whole group chat. You just say what needs doing. Then go do something better.\",\n  cta:'Try Kin free.',\n  legal:'Kin can make mistakes. Check important details.'\n};\nconst EX = {\n  proposition:'Life admin, handled.',\n  audience:'Busy adults 25 to 40 who run a job, a household and at least one group chat.',\n  mandatories:\"Legal line on every variant, word for word. Free trial is 14 days: state the length wherever 'free' appears.\",\n  tone:'Warm, plainspoken, dry, calm. No exclamation marks. Where it builds trust, show how Kin works in one line.',\n  headline:MASTER.headline, body:MASTER.body, cta:MASTER.cta, legal:MASTER.legal\n};\nconst EMPTY = {proposition:'',audience:'',mandatories:'',tone:'',headline:'',body:'',cta:'',legal:''};\nconst LIMITS = {proposition:60, audience:200, mandatories:300, tone:300, headline:60, body:300, cta:24, legal:80};\nconst REQUIRED = ['proposition','headline','body','cta','legal'];\nconst LABELS = {proposition:'Proposition',audience:'Audience',mandatories:'Mandatories',tone:'Tone notes',headline:'Headline',body:'Body',cta:'Call to action',legal:'Legal line'};\nconst HINTS = {proposition:'The one idea every market must keep.',audience:'Who this is for.',mandatories:'Lines and claims every market must carry.',tone:'How it should sound, beyond the voice guide.',legal:'Carried into every market word for word.'};\nconst REQMSG = {proposition:'Add the proposition. One line is enough.',headline:'Add the master headline.',body:'Add the master body copy.',cta:'Add the call to action.',legal:\"Add the legal line. It's carried into every market word for word.\"};\nconst S = (t,c) => ({t,c});\nconst CRIT = ['Proposition intact','Tone','Humour','Voice signatures','Mandatories'];\nconst PLAN = {za:[1400,1200,1000], ng:[1900,1500,1500], uk:[1200,1400,1100]};\nconst TOTAL = c => PLAN[c][0]+PLAN[c][1]+PLAN[c][2];\nconst UKFAIL = PLAN.uk[0] + PLAN.uk[1]*0.6;\n\nconst DATA = {\n  za:{\n    headline:[S('Admin, struck out','z1'), S('. The weekend is yours.')],\n    body:[S(\"Kin rebooks the dentist you've dodged since March, chases the refund, and finds a time that works for the whole \"), S('WhatsApp group','z2'), S('. '), S('It reads your inbox and texts so nothing slips.','z3'), S(' You just say what needs doing. Then go do something '), S('lekker','z4'), S('.')],\n    cta:[S('Try Kin free.')],\n    changes:{\n      z1:{was:'The admin is handled', src:'Market snapshot · ZA-V1', text:\"'Handled' reads as American. Local ads favour a shorter, punchier verb.\"},\n      z2:{was:'group chat', src:'Market snapshot · ZA-M3', text:'WhatsApp is the default group chat for most South Africans.'},\n      z3:{was:'Nothing. This sentence is new.', src:'Brief field · Tone notes', text:'\"Where it builds trust, show how Kin works in one line.\"'},\n      z4:{was:'better', src:'Market snapshot · ZA-V4', text:\"'Lekker' means good or enjoyable and is used across languages. Once per ad at most.\"}\n    },\n    scores:[2,2,1,2,1],\n    reasons:['The admin still gets done for you, and the weekend payoff stays.','Calm and plain throughout.',\"'Struck out' swaps dry understatement for an idiom that may not land.\",'Short sentences, no exclamation marks, the dry close kept.',\"Legal line present. 'Free' appears without the 14-day length.\"],\n    flags:[\n      {id:'zf1', sev:'High', text:\"Check: this claim says Kin reads inboxes and texts. South Africa's POPIA sets rules on processing personal information.\", cite:'ZA-C1', citeText:'POPIA: processing personal information needs a lawful basis and a clear purpose. Ads should not overstate data access.', change:'z3'},\n      {id:'zf2', sev:'Medium', text:\"Check: 'struck out' loses its baseball meaning here. The humour changed.\", cite:'ZA-V2', citeText:\"Baseball idioms don't travel. Use plain phrasing or a local reference.\", change:'z1'}\n    ],\n    lowConf:false\n  },\n  ng:{\n    headline:[S('The admin is handled. '), S('Your weekend is free.','n1')],\n    body:[S(\"Kin rebooks the dentist you've dodged since March, \"), S('follows up on','n2'), S(' the refund, and finds a time that works for the whole '), S('family WhatsApp group, even before the next wedding','n3'), S('. You just say what needs doing. Then go '), S('and enjoy your Saturday','n4'), S('.')],\n    cta:[S('Try Kin free.')],\n    changes:{\n      n1:{was:'The weekend is yours.', src:'Market snapshot · NG-V1', text:'A direct benefit reads warmer than a possessive in Nigerian English ads.'},\n      n2:{was:'chases', src:'Market snapshot · NG-V2', text:\"'Chase' can sound confrontational. 'Follow up' is the everyday phrase.\"},\n      n3:{was:'group chat', src:'No snapshot entry · NG-G1 (gap)', text:'No curated guidance for family occasions. Drafted from general knowledge.'},\n      n4:{was:'do something better', src:'Brief field · Audience', text:'\"Busy adults 25 to 40 who run a job, a household and at least one group chat.\"'}\n    },\n    scores:[2,2,1,1,1],\n    reasons:['Handled admin and a free weekend are both stated.','Warm and calm.',\"'Enjoy your Saturday' is kinder but loses the dry close.\",\"'Even before the next wedding' adds a clause the master wouldn't.\",\"Legal line present. 'Free' appears without the 14-day length.\"],\n    flags:[\n      {id:'nf1', sev:'Low confidence', text:'No curated guidance for family occasions in Nigeria. Creative director input needed.', cite:'NG-G1', citeText:'Gap: no entry for weddings, naming ceremonies or other family occasions.', change:'n3'},\n      {id:'nf2', sev:'Low', text:\"Check: 'follows up on' is softer than 'chases'. Is the dry edge still there?\", cite:'NG-V2', citeText:\"'Chase' can sound confrontational. 'Follow up' is the everyday phrase.\", change:'n2'}\n    ],\n    lowConf:true\n  },\n  uk:{\n    headline:[S('The admin is '), S('sorted','u1'), S('. The weekend is yours.')],\n    body:[S(\"Kin rebooks the dentist you've dodged since March, chases the refund, and finds a time that works for the whole group chat. You just say what needs doing. Then go \"), S('and do','u2'), S(' something better.')],\n    cta:[S('Try Kin '), S('free for 14 days','u3'), S('.')],\n    changes:{\n      u1:{was:'handled', src:'Market snapshot · UK-V1', text:\"'Sorted' is the everyday British word for done.\"},\n      u2:{was:'do', src:'Market snapshot · UK-V3', text:\"British English keeps the 'and' in 'go and do'.\"},\n      u3:{was:'free', src:'Brief field · Mandatories', text:\"\\\"Free trial is 14 days: state the length wherever 'free' appears.\\\"\"}\n    },\n    scores:[2,2,2,1,2],\n    reasons:['Unchanged from the master.','Unchanged from the master.','The dry close survives.',\"'Free for 14 days' is longer than the master's clipped CTA.\",\"Legal line present. Trial length stated beside 'free'.\"],\n    flags:[\n      {id:'uf1', sev:'Medium', text:'Check: UK ad rules expect the main conditions of a free trial close to the claim. Does the CTA need the price after 14 days?', cite:'UK-C2', citeText:'CAP Code: significant conditions of a free offer should sit close to the claim.', change:'u3'},\n      {id:'uf2', sev:'Low', text:\"Check: 'sorted' is common in UK ads. Does it still sound like Kin?\", cite:'UK-V1', citeText:\"'Sorted' is the everyday British word for done.\", change:'u1'}\n    ],\n    lowConf:false\n  }\n};\nconst CDS = {za:'Thandi Mokoena', ng:'Adaeze Okafor', uk:'Hannah Price'};\nconst stamp = () => { const d = new Date(); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };\nconst plain = (c,f) => DATA[c][f].map(x => x.t).join('');\nconst mkMarket = c => ({flags:Object.fromEntries(DATA[c].flags.map(f => [f.id,{state:'open'}])), edited:null, stale:false, rescores:0, decision:null});\nconst freshMarkets = () => ({za:mkMarket('za'), ng:mkMarket('ng'), uk:mkMarket('uk')});\nconst procAt = kind => {\n  const p = {failNext: kind !== 'done'};\n  CODES.forEach(c => { p[c] = {t: kind === 'running' ? 0 : TOTAL(c), failed:false}; });\n  if (kind === 'failed') p.uk = {t:UKFAIL, failed:true};\n  return p;\n};\n\nclass Component extends DCLogic {\n  state = {\n    screen:'home', homeState:'first',\n    brief:{...EX}, showErrors:false, runError:false, runsUsed:null, exampleMsg:false, voiceOpen:false,\n    sel:{za:true, ng:true, uk:true},\n    proc:procAt('done'), m:freshMarkets(),\n    market:'za', selChange:null, panel:null, cdName:'', rejectText:'', edit:{headline:'',body:'',cta:''},\n    dismissOpen:null, dismissText:'', log:[], msgs:{}, rescoring:false, preset:'first'\n  };\n\n  componentDidMount() {\n    this.iv = setInterval(() => {\n      const s = this.state; let changed = false, fail = false;\n      const p = {...s.proc};\n      CODES.forEach(c => {\n        if (!s.sel[c]) return;\n        const q = p[c];\n        if (q.failed || q.t >= TOTAL(c)) return;\n        const t = q.t + 100;\n        if (c === 'uk' && p.failNext && q.t < UKFAIL && t >= UKFAIL) { p[c] = {t:UKFAIL, failed:true}; fail = true; }\n        else p[c] = {t:Math.min(t, TOTAL(c)), failed:false};\n        changed = true;\n      });\n      if (changed) this.setState({proc:p});\n    }, 100);\n  }\n  componentWillUnmount() { clearInterval(this.iv); }\n\n  go(screen, extra) { this.setState({screen, ...(extra||{})}); try { window.scrollTo(0,0); } catch(e) {} }\n  used() { return this.state.runsUsed ?? this.props.runsUsedToday ?? 1; }\n  ready(c) { const q = this.state.proc[c]; return !q.failed && q.t >= TOTAL(c); }\n  who() { return this.state.cdName.trim() || 'You'; }\n  addLog(c, what, detail, who) { return [{at:stamp(), who: who || this.who(), market: c ? NAMES[c] : 'All', what, detail: detail || ''}, ...this.state.log]; }\n  setM(c, patch, logArgs) {\n    this.setState(s => ({ m: {...s.m, [c]: {...s.m[c], ...patch}}, ...(logArgs ? {log: this.addLog(c, ...logArgs)} : {}) }));\n  }\n  setFlag(c, id, v, logArgs) {\n    const M = this.state.m[c];\n    this.setM(c, {flags: {...M.flags, [id]: v}}, logArgs);\n  }\n  retryUk() {\n    this.setState(s => ({proc: {...s.proc, failNext:false, uk:{...s.proc.uk, failed:false}}}));\n  }\n\n  decidedState() {\n    const m = freshMarkets();\n    m.za.flags = {zf1:{state:'ack', by:CDS.za, at:'26 Sep, 14:18'}, zf2:{state:'dismissed', by:CDS.za, at:'26 Sep, 14:19', reason:\"Checked with the Joburg team. 'Struck out' reads fine locally.\"}};\n    m.za.decision = {type:'Approved', by:CDS.za, at:'26 Sep, 14:21'};\n    m.uk.flags = {uf1:{state:'ack', by:CDS.uk, at:'26 Sep, 14:40'}, uf2:{state:'ack', by:CDS.uk, at:'26 Sep, 14:40'}};\n    m.uk.decision = {type:'Approved', by:CDS.uk, at:'26 Sep, 14:42'};\n    m.ng.decision = {type:'Rejected', by:CDS.ng, at:'26 Sep, 14:33', reason:'The wedding line needs a local writer. Redraft with the Lagos team.'};\n    const log = [\n      {at:'26 Sep, 14:42', who:CDS.uk, market:'United Kingdom', what:'Approved', detail:''},\n      {at:'26 Sep, 14:40', who:CDS.uk, market:'United Kingdom', what:'Acknowledged 2 flags', detail:'UK-C2, UK-V1'},\n      {at:'26 Sep, 14:33', who:CDS.ng, market:'Nigeria', what:'Rejected', detail:'The wedding line needs a local writer. Redraft with the Lagos team.'},\n      {at:'26 Sep, 14:21', who:CDS.za, market:'South Africa', what:'Approved', detail:''},\n      {at:'26 Sep, 14:19', who:CDS.za, market:'South Africa', what:'Dismissed flag ZA-V2', detail:\"Checked with the Joburg team. 'Struck out' reads fine locally.\"},\n      {at:'26 Sep, 14:18', who:CDS.za, market:'South Africa', what:'Acknowledged flag ZA-C1', detail:'POPIA claim sent to legal for a check.'}\n    ];\n    return {m, log};\n  }\n\n  applyPreset(key) {\n    const base = {preset:key, panel:null, selChange:null, dismissOpen:null, rescoring:false, msgs:{}};\n    const P = {\n      first:   () => this.go('home', {...base, homeState:'first'}),\n      noruns:  () => this.go('home', {...base, homeState:'empty'}),\n      b_empty: () => this.go('brief', {...base, brief:{...EMPTY}, showErrors:false, runError:false, runsUsed:null, exampleMsg:false}),\n      b_ex:    () => this.go('brief', {...base, brief:{...EX}, showErrors:false, runError:false, runsUsed:null, exampleMsg:true}),\n      b_bad:   () => this.go('brief', {...base, brief:{...EX, proposition:'', headline:'The admin is handled, the errands are done, and the weekend is all yours.'}, showErrors:true, runError:false, runsUsed:null}),\n      b_budget:() => this.go('brief', {...base, brief:{...EX}, showErrors:false, runError:false, runsUsed:5}),\n      b_err:   () => this.go('brief', {...base, brief:{...EX}, showErrors:false, runError:true, runsUsed:null}),\n      p_run:   () => this.go('processing', {...base, sel:{za:true,ng:true,uk:true}, proc:procAt('running'), m:freshMarkets()}),\n      p_fail:  () => this.go('processing', {...base, sel:{za:true,ng:true,uk:true}, proc:procAt('failed'), m:freshMarkets()}),\n      p_done:  () => this.go('processing', {...base, sel:{za:true,ng:true,uk:true}, proc:procAt('done'), m:freshMarkets()}),\n      c_drafts:() => this.go('campaign', {...base, sel:{za:true,ng:true,uk:true}, proc:procAt('done'), m:freshMarkets(), log:[]}),\n      c_fail:  () => this.go('campaign', {...base, sel:{za:true,ng:true,uk:true}, proc:procAt('failed'), m:freshMarkets(), log:[]}),\n      c_dec:   () => this.go('campaign', {...base, sel:{za:true,ng:true,uk:true}, proc:procAt('done'), ...this.decidedState()}),\n      r_za:    () => this.go('review', {...base, market:'za', proc:procAt('done'), m:freshMarkets(), cdName:'', log:[]}),\n      r_ng:    () => this.go('review', {...base, market:'ng', proc:procAt('done'), m:freshMarkets(), cdName:'', log:[]}),\n      r_stale: () => { const m = freshMarkets(); m.za = {...m.za, edited:{headline:'Admin, sorted. The weekend is yours.', body:plain('za','body'), cta:'Try Kin free for 14 days.'}, stale:true, rescores:1}; this.go('review', {...base, market:'za', proc:procAt('done'), m, log:[]}); },\n      r_limit: () => { const m = freshMarkets(); m.za = {...m.za, edited:{headline:'Admin, sorted. The weekend is yours.', body:plain('za','body'), cta:'Try Kin free for 14 days.'}, stale:true, rescores:3}; this.go('review', {...base, market:'za', proc:procAt('done'), m, log:[]}); },\n      r_block: () => this.go('review', {...base, market:'za', proc:procAt('done'), m:freshMarkets(), panel:'approve', cdName:CDS.za, log:[]}),\n      r_appr:  () => { const d = this.decidedState(); this.go('review', {...base, market:'za', proc:procAt('done'), ...d}); },\n      h_empty: () => this.go('handoff', {...base, proc:procAt('done'), m:freshMarkets(), log:[]}),\n      h_appr:  () => this.go('handoff', {...base, proc:procAt('done'), ...this.decidedState()})\n    };\n    P[key]();\n  }\n\n  validate() {\n    const b = this.state.brief, e = {};\n    Object.keys(LIMITS).forEach(k => {\n      const n = b[k].length;\n      if (n > LIMITS[k]) e[k] = `${LABELS[k]} is ${n} characters. Cut ${n - LIMITS[k]} to fit ${LIMITS[k]}.`;\n      else if (this.state.showErrors && REQUIRED.includes(k) && !b[k].trim()) e[k] = REQMSG[k];\n    });\n    return e;\n  }\n  hardErrors() {\n    const b = this.state.brief, e = [];\n    Object.keys(LIMITS).forEach(k => { if (b[k].length > LIMITS[k] || (REQUIRED.includes(k) && !b[k].trim())) e.push(LABELS[k]); });\n    if (!CODES.some(c => this.state.sel[c])) e.push('Markets');\n    return e;\n  }\n  run() {\n    if (this.used() >= 5) return;\n    if (this.hardErrors().length) { this.setState({showErrors:true}); return; }\n    this.go('processing', {showErrors:false, runError:false, runsUsed:this.used()+1, proc:procAt('running'), m:freshMarkets(), log:[], market:CODES.find(c => this.state.sel[c]), preset:'p_run'});\n  }\n\n  field(k, rows) {\n    const b = this.state.brief, e = this.validate();\n    return {\n      id:'f-'+k, label:LABELS[k], hint:HINTS[k] || '', hasHint:!!HINTS[k], value:b[k],\n      onChange: ev => { const v = ev.target.value; this.setState(s => ({brief:{...s.brief, [k]:v}, exampleMsg:false})); },\n      count:`${b[k].length} / ${LIMITS[k]}`, error:e[k] || '', hasError:!!e[k],\n      border: e[k] ? '2px solid #1d1d1f' : '1px solid #d2d2d7',\n      isArea:!!rows, isInput:!rows, rows:rows || 1\n    };\n  }\n\n  segs(c, f) {\n    const s = this.state, M = s.m[c];\n    if (M.edited) return [{t:M.edited[f], isPlain:true}];\n    return DATA[c][f].map(x => {\n      if (!x.c) return {t:x.t, isPlain:true};\n      const on = s.selChange === x.c;\n      const pick = () => this.setState({selChange: on ? null : x.c});\n      return {t:x.t, isChange:true, pressed:on ? 'true' : 'false', bg:on ? '#1d1d1f' : '#e8e8ed', fg:on ? '#ffffff' : '#1d1d1f', pick, key: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } }};\n    });\n  }\n\n  review() {\n    const s = this.state, c = s.market, D = DATA[c], M = s.m[c];\n    const q = s.proc[c];\n    const ready = this.ready(c);\n    const flagsOpenHigh = D.flags.filter(f => f.sev === 'High' && M.flags[f.id].state === 'open');\n    const blocked = flagsOpenHigh.length > 0;\n    const dec = M.decision;\n    const segText = id => { for (const f of ['headline','body','cta']) { const x = D[f].find(y => y.c === id); if (x) return x.t; } return ''; };\n    const chIds = Object.keys(D.changes);\n    const ch = s.selChange && D.changes[s.selChange] && !M.edited ? D.changes[s.selChange] : null;\n    const flags = D.flags.map(f => {\n      const st = M.flags[f.id], open = st.state === 'open', hiOpen = f.sev === 'High' && open;\n      const dismissing = s.dismissOpen === f.id;\n      return {\n        sev:f.sev, text:f.text, cite:f.cite, citeText:f.citeText,\n        stateLabel: open ? (hiOpen ? 'Needs a decision before approval' : 'Open') : (st.state === 'ack' ? `Acknowledged by ${st.by}, ${st.at}` : `Dismissed by ${st.by}, ${st.at}`),\n        stateColor: hiOpen ? ACCENT : '#6e6e73', sevColor: hiOpen ? ACCENT : '#1d1d1f',\n        rule: hiOpen ? `2px solid ${ACCENT}` : '1px solid #e8e8ed',\n        hasReason: st.state === 'dismissed', reason: st.reason || '',\n        showActions: open && !dismissing && !dec, resolved: !open && !dec, dismissing: dismissing && open,\n        hasChange: !!f.change && !M.edited, showChange: () => this.setState({selChange:f.change}),\n        ack: () => this.setFlag(c, f.id, {state:'ack', by:this.who(), at:stamp()}, ['Acknowledged flag '+f.cite, '']),\n        dismiss: () => this.setState({dismissOpen:f.id, dismissText:''}),\n        inputId:'d-'+f.id, dText:s.dismissText, onDText: ev => this.setState({dismissText:ev.target.value}),\n        canConfirm: !!s.dismissText.trim(), cannotConfirm: !s.dismissText.trim(),\n        confirmDismiss: () => { const r = s.dismissText.trim(); this.setState({dismissOpen:null, dismissText:''}); this.setFlag(c, f.id, {state:'dismissed', by:this.who(), at:stamp(), reason:r}, ['Dismissed flag '+f.cite, r]); },\n        cancelDismiss: () => this.setState({dismissOpen:null, dismissText:''}),\n        undo: () => this.setFlag(c, f.id, {state:'open'}, ['Reopened flag '+f.cite, ''])\n      };\n    });\n    const sevCount = n => D.flags.filter(f => f.sev === n || (n === 'Low' && f.sev === 'Low confidence')).length;\n    const stale = M.stale, left = 3 - M.rescores;\n    const panel = dec ? null : s.panel;\n    const btn = (key, label, help, helpColor) => ({label, help, helpColor, pressed: panel === key ? 'true' : 'false', bg: panel === key ? '#1d1d1f' : '#ffffff', fg: panel === key ? '#ffffff' : '#1d1d1f',\n      go: () => { if (key === 'edit' && panel !== 'edit') { this.setState({panel:'edit', edit:{headline: M.edited ? M.edited.headline : plain(c,'headline'), body: M.edited ? M.edited.body : plain(c,'body'), cta: M.edited ? M.edited.cta : plain(c,'cta')}}); } else this.setState({panel: panel === key ? null : key}); }});\n    const nm = s.cdName.trim();\n    const idx = CODES.indexOf(c), nextC = CODES.slice(idx+1).concat(CODES.slice(0, idx)).find(x => s.sel[x] && !s.m[x].decision && this.ready(x));\n    const hiNames = flagsOpenHigh.map(f => f.cite).join(', ');\n    return {\n      name:NAMES[c], ready, notReady:!ready, failed:q.failed,\n      notReadyText: q.failed ? 'Scoring stopped for this market. The draft is kept. Retry to pick up from scoring.' : 'This market is still drafting. It appears here when it finishes.',\n      retry: () => this.retryUk(),\n      status: dec ? dec.type : 'Draft', lowConf:D.lowConf,\n      prov: dec && dec.type === 'Approved' ? `Approved by ${dec.by}, ${dec.at}` : (M.edited ? 'AI draft, edited by you' : 'AI draft'),\n      surface: dec && dec.type === 'Approved' ? '#ffffff' : '#f5f5f7',\n      surfaceBorder: dec && dec.type === 'Approved' ? '1px solid #d2d2d7' : '1px solid #f5f5f7',\n      showCopy: panel !== 'edit', isEdit: panel === 'edit',\n      headline:this.segs(c,'headline'), body:this.segs(c,'body'), cta:this.segs(c,'cta'),\n      changesLine: M.edited ? 'Edited by you. Change marks are cleared after an edit. The original draft is in the decision log.' : `${chIds.length} changes from the master are marked. Select one to see where it came from.`,\n      hasDetail:!!ch,\n      detail: ch ? {n:`Change ${chIds.indexOf(s.selChange)+1} of ${chIds.length}`, was:ch.was, now:segText(s.selChange), src:ch.src, text:ch.text} : {n:'',was:'',now:'',src:'',text:''},\n      closeDetail: () => this.setState({selChange:null}),\n      flags,\n      flagSummary: `${sevCount('High')} High · ${sevCount('Medium')} Medium · ${sevCount('Low')} Low` + (blocked ? ` · ${flagsOpenHigh.length} high open` : ''),\n      stale, canRescore: stale && left > 0 && !s.rescoring, rescoring: s.rescoring,\n      rescoreLabel: `Rescore (${left} of 3 left)`,\n      staleText: left > 0 ? 'These scores are for the draft before your edit, so they may be out of date. They stay advisory either way.' : \"You've used all 3 rescores for this variant. The scores stay out of date. They're advisory, so you can still approve.\",\n      rescore: () => { this.setState({rescoring:true}); setTimeout(() => { this.setState({rescoring:false}); this.setM(c, {stale:false, rescores:M.rescores+1}, ['Rescored', `${M.rescores+1} of 3 used`]); }, 900); },\n      scores: CRIT.map((n,i) => ({name:n, v:String(D.scores[i]), reason:D.reasons[i], color: stale ? '#6e6e73' : '#1d1d1f'})),\n      undecided: !dec, decided: !!dec,\n      decisionBtns: [\n        btn('approve', 'Approve', blocked ? `${flagsOpenHigh.length} high flag needs a decision first.` : 'Needs your name.', blocked ? ACCENT : '#6e6e73'),\n        btn('edit', 'Edit', 'Change the copy inline.', '#6e6e73'),\n        btn('reject', 'Reject', 'Needs a reason.', '#6e6e73')\n      ],\n      isApprove: panel === 'approve', isReject: panel === 'reject',\n      canApprove: !blocked && !!nm, cannotApprove: blocked || !nm,\n      approveMsg: blocked ? `Approval is waiting on the high flag ${hiNames}. Acknowledge or dismiss it in Flags above. The score doesn't affect this.` : (!nm ? 'Add your name to approve. It goes in the decision log with the time.' : 'Your name and the time go in the decision log.'),\n      approveMsgColor: blocked ? ACCENT : '#6e6e73',\n      approve: () => { const at = stamp(); this.setState(st => ({panel:null, m:{...st.m, [c]:{...st.m[c], decision:{type:'Approved', by:nm, at}}}, log:[{at, who:nm, market:NAMES[c], what:'Approved', detail: st.m[c].edited ? 'Approved with edits' : ''}, ...st.log.map(l => l.who === 'You' && l.market === NAMES[c] ? {...l, who:nm} : l)]})); },\n      canReject: !!s.rejectText.trim(), cannotReject: !s.rejectText.trim(),\n      reject: () => { const r = s.rejectText.trim(); this.setState({panel:null, rejectText:''}); this.setM(c, {decision:{type:'Rejected', by:this.who(), at:stamp(), reason:r}}, ['Rejected', r]); },\n      decisionLine: dec ? `${dec.type} by ${dec.by}, ${dec.at}.` : '',\n      hasDecisionReason: !!(dec && dec.reason), decisionReason: dec && dec.reason || '',\n      undo: () => this.setM(c, {decision:null}, ['Returned to Draft', 'Undid ' + (dec ? dec.type.toLowerCase() : '')]),\n      hasNext: !!nextC, nextLabel: nextC ? `Next: ${NAMES[nextC]}` : '', next: () => this.go('review', {market:nextC, selChange:null, panel:null})\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const used = this.used();\n    const screens = [['Home','home','first'],['Brief','brief','b_ex'],['Processing','processing','p_run'],['Campaign','campaign',null],['Review','review',null],['Handoff','handoff',null]];\n    const nav = screens.map(([label, key]) => ({label, current: s.screen === key ? 'page' : 'false', deco: s.screen === key ? 'underline' : 'none',\n      go: () => this.go(key, key === 'processing' && s.preset === 'first' ? {proc:procAt('running'), m:freshMarkets()} : {})}));\n    const PRE = {\n      home:[['First visit','first'],['No runs measured yet','noruns']],\n      brief:[['Empty','b_empty'],['Example loaded','b_ex'],['Needs fixes','b_bad'],['Runs used up','b_budget'],[\"Run didn't start\",'b_err']],\n      processing:[['Running','p_run'],['One market failed','p_fail'],['All done','p_done']],\n      campaign:[['Drafts ready','c_drafts'],['One market failed','c_fail'],['Decisions made','c_dec']],\n      review:[['South Africa, high flag','r_za'],['Nigeria, low confidence','r_ng'],['Score out of date','r_stale'],['Rescore limit reached','r_limit'],['Approve blocked','r_block'],['Approved','r_appr']],\n      handoff:[['Nothing approved','h_empty'],['Approved copy','h_appr']]\n    };\n    const stateLinks = (PRE[s.screen] || []).map(([label, key]) => ({label, deco: s.preset === key ? 'underline' : 'none', go: () => this.applyPreset(key)}));\n\n    const hard = this.hardErrors();\n    const selCodes = CODES.filter(c => s.sel[c]);\n    const procRows = selCodes.map(c => {\n      const q = s.proc[c]; let start = 0;\n      const steps = ['Drafting','Scoring','Flagging'].map((label, i) => {\n        const d = PLAN[c][i], s0 = start; start += d;\n        let st, pct;\n        if (q.t >= s0 + d) { st = 'Done'; pct = 100; }\n        else if (q.failed && q.t >= s0) { st = 'Stopped'; pct = Math.round((q.t - s0) / d * 100); }\n        else if (q.t > s0) { st = 'Working'; pct = Math.round((q.t - s0) / d * 100); }\n        else { st = 'Waiting'; pct = 0; }\n        return {st, pct: pct + '%'};\n      });\n      const done = this.ready(c);\n      const D = DATA[c];\n      return {name:NAMES[c], steps, done, failed:q.failed, working:!done && !q.failed,\n        workingText: q.t > 0 ? 'Working. Other markets carry on.' : 'Waiting to start.',\n        headline: plain(c,'headline'), flagLine: `${D.flags.length} flags to check` + (D.lowConf ? ' · Low confidence' : ''),\n        retry: () => this.retryUk()};\n    });\n    const doneN = selCodes.filter(c => this.ready(c)).length;\n    const failN = selCodes.filter(c => s.proc[c].failed).length;\n\n    const ovRows = selCodes.map(c => {\n      const D = DATA[c], M = s.m[c], q = s.proc[c], ready = this.ready(c);\n      const cnt = n => D.flags.filter(f => f.sev === n || (n === 'Low' && f.sev === 'Low confidence')).length;\n      const hiOpen = D.flags.filter(f => f.sev === 'High' && M.flags[f.id].state === 'open').length;\n      return {name:NAMES[c], ready, notReady:!ready, failed:q.failed, lowConf:D.lowConf && ready, stale:M.stale && ready,\n        notReadyText: q.failed ? 'Scoring stopped. The draft is kept.' : 'Still drafting. This row fills in when it finishes.',\n        retry: () => this.retryUk(),\n        scores: D.scores.map(v => ({v:String(v)})),\n        flagsText:`${cnt('High')} High · ${cnt('Medium')} Med · ${cnt('Low')} Low`,\n        hasHighOpen: hiOpen > 0, highOpenText: `${hiOpen} high flag open`,\n        status: M.decision ? M.decision.type : 'Draft',\n        open: () => this.go('review', {market:c, selChange:null, panel:null})};\n    });\n\n    const approved = CODES.filter(c => s.m[c].decision && s.m[c].decision.type === 'Approved' && s.sel[c]);\n    const text = c => { const M = s.m[c]; return M.edited ? {headline:M.edited.headline, body:M.edited.body, cta:M.edited.cta} : {headline:plain(c,'headline'), body:plain(c,'body'), cta:plain(c,'cta')}; };\n    const hoApproved = approved.map(c => {\n      const t = text(c), d = s.m[c].decision;\n      const txt = `Kin · ${NAMES[c]}\\nApproved by ${d.by}, ${d.at}\\n\\n${t.headline}\\n\\n${t.body}\\n\\n${t.cta}\\n\\n${MASTER.legal}\\n`;\n      const say = m => this.setState(st => ({msgs:{...st.msgs, [c]:m}}));\n      return {name:NAMES[c], by:d.by, at:d.at, ...t, legal:MASTER.legal, msg: s.msgs[c] || '',\n        copy: () => { say('Copying…'); const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject(); p.then(() => say('Copied. Paste it wherever you work.'), () => say(\"Couldn't reach the clipboard. Select the copy on the right and press Ctrl+C.\")); },\n        download: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'})); a.download = `kin-${c}-approved.txt`; document.body.appendChild(a); a.click(); a.remove(); say(`Downloaded kin-${c}-approved.txt.`); }};\n    });\n    const hoOthers = selCodes.filter(c => !approved.includes(c)).map(c => {\n      const d = s.m[c].decision;\n      return {text: d ? `${NAMES[c]}: rejected by ${d.by}. Not included.` : `${NAMES[c]}: still a draft. It appears here once approved.`};\n    });\n\n    const reqs = [\n      {label:'Proposition', rule:'Required · up to 60'},\n      {label:'Headline', rule:'Required · up to 60'},\n      {label:'Body', rule:'Required · up to 300'},\n      {label:'Call to action', rule:'Required · up to 24'},\n      {label:'Legal line', rule:'Required · kept word for word'},\n      {label:'Audience, mandatories, tone', rule:'Optional · up to 300'},\n      {label:'Markets', rule:'At least one'}\n    ];\n    const M = s.m[s.market];\n    const rv = this.review();\n\n    return {\n      nav, stateLinks, showStateBar: this.props.showStateBar ?? true,\n      isHome:s.screen === 'home', isBrief:s.screen === 'brief', isProcessing:s.screen === 'processing', isCampaign:s.screen === 'campaign', isReview:s.screen === 'review', isHandoff:s.screen === 'handoff',\n      homeFirst:s.homeState === 'first', homeHasRuns:s.homeState !== 'empty', homeNoRuns:s.homeState === 'empty',\n      measuredLabel: s.homeState === 'empty' ? 'Measured across 0 runs' : 'Measured across 24 runs',\n      openExample: () => this.applyPreset('c_drafts'),\n      newAdaptation: () => this.applyPreset('b_empty'),\n      goCampaign: () => this.go('campaign', {preset:null}), goBrief: () => this.go('brief', {preset:null}), goHandoff: () => this.go('handoff', {preset:null}),\n\n      briefIntro: s.brief.headline ? 'Check the brief, pick markets, then run.' : 'Start from scratch, or load the example brief.',\n      exampleLoadedMsg: s.exampleMsg,\n      loadExample: () => this.setState({brief:{...EX}, showErrors:false, exampleMsg:true}),\n      voiceOpen:s.voiceOpen, voiceLinkLabel: s.voiceOpen ? 'Hide voice guide' : 'View voice guide', toggleVoice: () => this.setState({voiceOpen:!s.voiceOpen}),\n      briefFields: [this.field('proposition'), this.field('audience',2), this.field('mandatories',3), this.field('tone',3)],\n      copyFields: [this.field('headline'), this.field('body',4), this.field('cta'), this.field('legal')],\n      marketChecks: CODES.map(c => ({name:NAMES[c], checked:!!s.sel[c], toggle: () => this.setState(st => ({sel:{...st.sel, [c]:!st.sel[c]}}))})),\n      marketError: s.showErrors && !selCodes.length,\n      runEnabled: used < 5, runDisabled: used >= 5, budgetOut: used >= 5,\n      runLabel: s.runError ? 'Try again' : 'Run adaptation',\n      runBudgetText: used >= 5 ? 'All 5 runs used today' : `Uses 1 of 5 runs today. ${5 - used} left.`,\n      runError: s.runError && used < 5,\n      run: () => this.run(),\n      showSummary: s.showErrors && hard.length > 0,\n      summaryText: `Fix ${hard.length === 1 ? 'one thing' : hard.length + ' things'} above before running: ${hard.join(', ')}. Everything else is kept.`,\n      reqs,\n\n      procCountText: selCodes.length === 1 ? '1 market' : `${selCodes.length} markets`,\n      procRows, canOpenCampaign: doneN > 0, cannotOpenCampaign: doneN === 0,\n      procSummary: `${doneN} of ${selCodes.length} ready` + (failN ? ` · ${failN} stopped` : '') + (doneN > 0 && doneN < selCodes.length ? '. You can start reviewing now.' : '.'),\n\n      ovMarketsText: selCodes.map(c => NAMES[c]).join(', ').replace(/, ([^,]*)$/, ' and $1'),\n      critNames: CRIT.map(n => ({name:n})), ovRows,\n\n      reviewTabs: selCodes.map(c => ({label:`${NAMES[c]} · ${this.ready(c) ? (s.m[c].decision ? s.m[c].decision.type : 'Draft') : 'Not ready'}`, deco: s.market === c ? 'underline' : 'none', go: () => this.setState({market:c, selChange:null, panel:null, dismissOpen:null})})),\n      rv, master:MASTER,\n      edit: {...s.edit,\n        onHeadline: e => { const v = e.target.value; this.setState(st => ({edit:{...st.edit, headline:v}})); },\n        onBody: e => { const v = e.target.value; this.setState(st => ({edit:{...st.edit, body:v}})); },\n        onCta: e => { const v = e.target.value; this.setState(st => ({edit:{...st.edit, cta:v}})); },\n        save: () => { const c = s.market; this.setState({panel:null, selChange:null}); this.setM(c, {edited:{...s.edit}, stale:true}, ['Edited copy', 'Scores marked out of date']); },\n        cancel: () => this.setState({panel:null})\n      },\n      cdName:s.cdName, onName: e => this.setState({cdName:e.target.value}),\n      rejectText:s.rejectText, onReject: e => this.setState({rejectText:e.target.value}),\n\n      hoEmpty: !approved.length, hoApproved, hoOthers, hoHasOthers: approved.length > 0 && hoOthers.length > 0,\n      logRows: s.log, logEmpty: !s.log.length\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
