document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e78051f0-ab28-4fb6-9b6a-ed2fb9059a7c\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e0829c65-3d99-4aa3-9386-905586319a29\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"dc2e2f05-e3a4-4f35-813a-41a06c91aa7e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2cf3d255-6792-4313-89cb-050cf7e83bb5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#ffffff;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}\na{color:#1d1d1f;text-underline-offset:3px}\na:hover{color:#6e6e73}\n*{box-sizing:border-box}\nbutton,input,textarea{font-family:inherit}\n@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<header style=\"position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,0.08)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 48px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:32px\">\n    <div style=\"display:flex;gap:8px;align-items:baseline\">\n      <span style=\"font-size:16px\">Kin<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Adaptation Engine<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:32px\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ n.go }}\" aria-current=\"{{ n.current }}\" style=\"background:none;border:0;padding:0;font-size:13px;color:#1d1d1f;cursor:pointer;text-decoration:{{ n.deco }};text-underline-offset:6px;text-decoration-thickness:1px;transition:color 200ms ease-out\" style-hover=\"color:#6e6e73\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ showStateBar }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#f5f5f7\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:10px 48px;display:flex;gap:24px;align-items:baseline;flex-wrap:wrap\">\n      <span style=\"font-size:13px;color:#6e6e73\">Prototype states for this screen<\u002Fspan>\n      <sc-for list=\"{{ stateLinks }}\" as=\"sl\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ sl.go }}\" style=\"background:none;border:0;padding:0;font-size:13px;color:#1d1d1f;cursor:pointer;text-decoration:{{ sl.deco }};text-underline-offset:4px\">{{ sl.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- HOME -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<main data-screen-label=\"01 Home\" style=\"max-width:1200px;width:100%;margin:0 auto;padding:128px 48px 128px;display:grid;gap:80px\">\n  <div style=\"display:grid;gap:24px;max-width:760px\">\n    <h1 style=\"margin:0;font-size:56px;line-height:1.05;font-weight:400;letter-spacing:-0.035em;text-wrap:balance\">The AI drafts and flags. You decide.<\u002Fh1>\n    <p style=\"margin:0;font-size:18px;line-height:1.45;color:#6e6e73;text-wrap:pretty;max-width:60ch\">Give it a global brief and US master copy. It drafts a version for South Africa, Nigeria and the UK, scores each one against the brand voice, and flags what to check. A local creative director approves, edits or rejects every draft. Nothing is published from here.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:16px\">\n    <sc-if value=\"{{ homeFirst }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"margin:0;font-size:13px;color:#6e6e73\">Start here. The Kin example is already drafted for three markets.<\u002Fp>\n    <\u002Fsc-if>\n    <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ openExample }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 150ms ease-out\" style-hover=\"background:#424245\">Open the example campaign<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ newAdaptation }}\" style=\"height:48px;padding:0 24px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 150ms ease-out\" style-hover=\"background:#f5f5f7\">Start a new adaptation<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <section style=\"display:grid;gap:32px;border-top:1px solid #e8e8ed;padding-top:32px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;justify-content:space-between;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Efficiency<\u002Fh2>\n      <span style=\"font-size:13px;color:#6e6e73;font-variant-numeric:tabular-nums\">{{ measuredLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ homeHasRuns }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px\">\n        <div style=\"display:grid;gap:8px;align-content:start\"><span style=\"font-size:56px;line-height:1.05;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;white-space:nowrap\">1:52<\u002Fspan><span style=\"font-size:16px;color:#6e6e73\">Time to draft, per market (min:sec)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;gap:8px;align-content:start\"><span style=\"font-size:56px;line-height:1.05;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;white-space:nowrap\">6:40<\u002Fspan><span style=\"font-size:16px;color:#6e6e73\">Review time, per market (min:sec)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;gap:8px;align-content:start\"><span style=\"font-size:56px;line-height:1.05;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;white-space:nowrap\">81%<\u002Fspan><span style=\"font-size:16px;color:#6e6e73\">Words kept from the AI draft<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;gap:8px;align-content:start\"><span style=\"font-size:56px;line-height:1.05;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;white-space:nowrap\">72%<\u002Fspan><span style=\"font-size:16px;color:#6e6e73\">Flags acknowledged rather than dismissed<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ homeNoRuns }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;font-size:16px;color:#6e6e73;max-width:66ch\">No runs measured yet. These numbers fill in after your first reviewed run. The example campaign doesn't count towards them.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- BRIEF -->\n<sc-if value=\"{{ isBrief }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"02 Brief\" style=\"max-width:1200px;width:100%;margin:0 auto;padding:88px 48px 128px;display:grid;gap:64px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n    <div style=\"display:grid;gap:16px\">\n      <h1 style=\"margin:0;font-size:56px;line-height:1.05;font-weight:400;letter-spacing:-0.035em\">Brief<\u002Fh1>\n      <p style=\"margin:0;font-size:16px;color:#6e6e73\">{{ briefIntro }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:center\">\n      <sc-if value=\"{{ exampleLoadedMsg }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:#6e6e73\">Example brief loaded.<\u002Fspan><\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ loadExample }}\" style=\"height:48px;padding:0 24px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Load example brief<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:48px\">\n    <div style=\"grid-column:span 8;display:grid;gap:48px\">\n\n      <section style=\"display:grid;gap:16px\">\n        <div style=\"display:flex;gap:24px;align-items:baseline\">\n          <span style=\"font-size:13px;color:#6e6e73\">Brand<\u002Fspan>\n          <span style=\"font-size:16px\">Kin<\u002Fspan>\n          <span style=\"font-size:13px;color:#6e6e73\">Read-only<\u002Fspan>\n          <button sc-camel-on-click=\"{{ toggleVoice }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">{{ voiceLinkLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ voiceOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;gap:8px;border-top:1px solid #e8e8ed;padding-top:16px;max-width:66ch\">\n            <p style=\"margin:0;font-size:16px\">Voice: warm, plainspoken, dry, calm.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;color:#6e6e73\">Signatures: short sentences, a dry closing turn, everyday errands named plainly. No exclamation marks. Proposition: Life admin, handled.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"display:grid;gap:32px\">\n        <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">The brief<\u002Fh2>\n        <sc-for list=\"{{ briefFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;gap:8px\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\">\n              <label for=\"{{ f.id }}\" style=\"font-size:16px\">{{ f.label }}<\u002Flabel>\n              <span style=\"font-size:13px;color:#6e6e73;font-variant-numeric:tabular-nums\">{{ f.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:13px;color:#6e6e73\">{{ f.hint }}<\u002Fspan>\n            <sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ true }}\">\n              <input id=\"{{ f.id }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"height:52px;padding:0 16px;border:{{ f.border }};border-radius:12px;font-size:16px;color:#1d1d1f;background:#ffffff;outline-offset:2px\">\n            <\u002Fsc-if>\n            <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n              <textarea id=\"{{ f.id }}\" rows=\"{{ f.rows }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"padding:12px;border:{{ f.border }};border-radius:12px;font-size:16px;line-height:1.4;color:#1d1d1f;background:#ffffff;resize:vertical;outline-offset:2px\"><\u002Ftextarea>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ f.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:16px\">{{ f.error }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <section style=\"display:grid;gap:32px\">\n        <div style=\"display:grid;gap:8px\">\n          <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Global master copy<\u002Fh2>\n          <span style=\"font-size:13px;color:#6e6e73\">US English. This is what each market adapts from.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ copyFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;gap:8px\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\">\n              <label for=\"{{ f.id }}\" style=\"font-size:16px\">{{ f.label }}<\u002Flabel>\n              <span style=\"font-size:13px;color:#6e6e73;font-variant-numeric:tabular-nums\">{{ f.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ f.hasHint }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:#6e6e73\">{{ f.hint }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ true }}\">\n              <input id=\"{{ f.id }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"height:52px;padding:0 16px;border:{{ f.border }};border-radius:12px;font-family:'Newsreader',Georgia,serif;font-size:18px;color:#1d1d1f;background:#ffffff\">\n            <\u002Fsc-if>\n            <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n              <textarea id=\"{{ f.id }}\" rows=\"{{ f.rows }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"padding:12px;border:{{ f.border }};border-radius:12px;font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.4;color:#1d1d1f;background:#ffffff;resize:vertical\"><\u002Ftextarea>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ f.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:16px\">{{ f.error }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <section style=\"display:grid;gap:16px\">\n        <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Markets<\u002Fh2>\n        <div style=\"display:flex;gap:16px;align-items:center;height:48px\">\n          <span style=\"width:20px;height:20px;display:inline-block;border:1px solid #d2d2d7;border-radius:6px;background:#f5f5f7\"><\u002Fspan>\n          <span style=\"font-size:16px\">United States<\u002Fspan>\n          <span style=\"font-size:13px;color:#6e6e73\">Source market. Always included.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ marketChecks }}\" as=\"mc\" hint-placeholder-count=\"3\">\n          <label style=\"display:flex;gap:16px;align-items:center;height:48px;cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ mc.checked }}\" sc-camel-on-change=\"{{ mc.toggle }}\" style=\"width:20px;height:20px;margin:0;accent-color:#1d1d1f;cursor:pointer\">\n            <span style=\"font-size:16px\">{{ mc.name }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ marketError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:16px\">Pick at least one market to adapt for.<\u002Fp><\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"display:grid;gap:16px;border-top:1px solid #e8e8ed;padding-top:32px\">\n        <div style=\"display:flex;gap:24px;align-items:center;flex-wrap:wrap\">\n          <sc-if value=\"{{ runEnabled }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ run }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#424245\" style-active=\"transform:scale(0.98)\">{{ runLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ runDisabled }}\" hint-placeholder-val=\"{{ false }}\">\n            <button disabled=\"\" aria-disabled=\"true\" style=\"height:48px;padding:0 24px;background:#e8e8ed;color:#6e6e73;border:1px solid #e8e8ed;border-radius:999px;font-size:16px;cursor:not-allowed\">Run adaptation<\u002Fbutton>\n          <\u002Fsc-if>\n          <span style=\"font-size:16px;color:#6e6e73;font-variant-numeric:tabular-nums\">{{ runBudgetText }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showSummary }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:16px;max-width:66ch\">{{ summaryText }}<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ budgetOut }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;gap:8px;max-width:66ch\">\n            <p style=\"margin:0;font-size:16px\">You've used all 5 runs for today. Your brief is saved on this page. Runs reset at midnight UTC.<\u002Fp>\n            <p style=\"margin:0;font-size:16px\">While you wait, you can <button sc-camel-on-click=\"{{ openExample }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">open the example campaign<\u002Fbutton>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ runError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:16px;max-width:66ch\">The run didn't start because the connection dropped. Your brief is saved and no run was used. Check your connection, then try again.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n\n    <aside style=\"grid-column:span 4;display:grid;gap:16px;align-content:start;position:sticky;top:32px\">\n      <h2 style=\"margin:0;font-size:16px;font-weight:400\">Before you run<\u002Fh2>\n      <sc-for list=\"{{ reqs }}\" as=\"rq\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;border-top:1px solid #e8e8ed;padding-top:12px\">\n          <span style=\"font-size:16px\">{{ rq.label }}<\u002Fspan>\n          <span style=\"font-size:13px;color:#6e6e73;font-variant-numeric:tabular-nums;text-align:right\">{{ rq.rule }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <p style=\"margin:0;font-size:13px;color:#6e6e73;border-top:1px solid #e8e8ed;padding-top:12px\">Each market takes about two minutes. You can leave this page while it runs.<\u002Fp>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- PROCESSING -->\n<sc-if value=\"{{ isProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"03 Processing\" style=\"max-width:1200px;width:100%;margin:0 auto;padding:88px 48px 128px;display:grid;gap:64px\">\n  <div style=\"display:grid;gap:16px\">\n    <h1 style=\"margin:0;font-size:56px;line-height:1.05;font-weight:400;letter-spacing:-0.035em\">Drafting for {{ procCountText }}<\u002Fh1>\n    <p style=\"margin:0;font-size:16px;color:#6e6e73\">Each market drafts, scores and flags on its own. Results show up as each one finishes.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid\">\n    <div style=\"display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr)) 340px;gap:32px;padding-bottom:12px\">\n      <span style=\"font-size:13px;color:#6e6e73\">Market<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Drafting<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Scoring<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Flagging<\u002Fspan>\n      <span style=\"font-size:13px;color:#6e6e73\">Result<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ procRows }}\" as=\"pr\" hint-placeholder-count=\"3\">\n      <div style=\"display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr)) 340px;gap:32px;padding:24px 0;border-top:1px solid #e8e8ed;align-items:start\">\n        <span style=\"font-size:18px\">{{ pr.name }}<\u002Fspan>\n        <sc-for list=\"{{ pr.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;gap:8px\">\n            <div style=\"height:3px;background:#e8e8ed;border-radius:999px;overflow:hidden\"><div style=\"height:3px;border-radius:999px;width:{{ st.pct }};background:#1d1d1f;transition:width 100ms linear\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:13px;color:#6e6e73\">{{ st.st }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;gap:8px\">\n          <sc-if value=\"{{ pr.done }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:13px;color:#6e6e73\">AI draft ready<\u002Fspan>\n            <span style=\"font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.4\">{{ pr.headline }}<\u002Fspan>\n            <span style=\"font-size:13px;color:#6e6e73\">{{ pr.flagLine }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ pr.working }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"font-size:16px;color:#6e6e73\">{{ pr.workingText }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ pr.failed }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:16px\">Scoring stopped. The scoring service didn't answer in time. The UK draft is kept, so a retry picks up from scoring.<\u002Fp>\n            <div><button sc-camel-on-click=\"{{ pr.retry }}\" style=\"height:48px;padding:0 24px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Retry scoring<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:24px;align-items:center;border-top:1px solid #e8e8ed;padding-top:32px\">\n    <sc-if value=\"{{ canOpenCampaign }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ goCampaign }}\" style=\"height:48px;padding:0 24px;background:#1d1d1f;color:#ffffff;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#424245\" style-active=\"transform:scale(0.98)\">Open campaign<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ cannotOpenCampaign }}\" hint-placeholder-val=\"{{ true }}\">\n      <button disabled=\"\" style=\"height:48px;padding:0 24px;background:#e8e8ed;color:#6e6e73;border:1px solid #e8e8ed;border-radius:999px;font-size:16px;cursor:not-allowed\">Open campaign<\u002Fbutton>\n    <\u002Fsc-if>\n    <span style=\"font-size:16px;color:#6e6e73;font-variant-numeric:tabular-nums\">{{ procSummary }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- CAMPAIGN OVERVIEW -->\n<sc-if value=\"{{ isCampaign }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"04 Campaign overview\" style=\"max-width:1200px;width:100%;margin:0 auto;padding:88px 48px 128px;display:grid;gap:64px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n    <div style=\"display:grid;gap:16px\">\n      <span style=\"font-size:13px;color:#6e6e73\">Kin campaign<\u002Fspan>\n      <h1 style=\"margin:0;font-size:56px;line-height:1.05;font-weight:400;letter-spacing:-0.035em\">Life admin, handled.<\u002Fh1>\n      <p style=\"margin:0;font-size:16px;color:#6e6e73\">US master adapted for {{ ovMarketsText }}. Every draft waits for a creative director.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ goBrief }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">View brief<\u002Fbutton>\n  <\u002Fdiv>\n\n  <section style=\"display:grid;gap:16px\">\n    <h2 style=\"margin:0;font-size:16px;font-weight:400\">Brief-level flag<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px;border-top:1px solid #e8e8ed;padding-top:16px\">\n      <span style=\"font-size:16px\">Medium<\u002Fspan>\n      <div style=\"display:grid;gap:8px;max-width:66ch\">\n        <p style=\"margin:0;font-size:16px;text-wrap:pretty\">Check: the master CTA says 'free' without the 14-day trial length. The mandatories ask for it wherever 'free' appears, so every market inherits this.<\u002Fp>\n        <p style=\"margin:0;font-size:13px;color:#6e6e73\">Cites Brief · Mandatories: \"Free trial is 14 days: state the length wherever 'free' appears.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid;gap:16px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-size:28px;font-weight:400;letter-spacing:-0.02em\">Drift from the master<\u002Fh2>\n      <span style=\"font-size:13px;color:#6e6e73\">Advisory. 2 kept, 1 changed, 0 lost.<\u002Fspan>\n    <\u002Fdiv>\n    <div role=\"table\" style=\"display:grid\">\n      <div role=\"row\" style=\"display:grid;grid-template-columns:170px repeat(5,minmax(0,1fr)) 200px 110px 110px;gap:16px;padding-bottom:12px;align-items:end\">\n        <span role=\"columnheader\" style=\"font-size:13px;color:#6e6e73\">Market<\u002Fspan>\n        <sc-for list=\"{{ critNames }}\" as=\"cn\" hint-placeholder-count=\"5\"><span role=\"columnheader\" style=\"font-size:13px;color:#6e6e73;text-align:center\">{{ cn.name }}<\u002Fspan><\u002Fsc-for>\n t-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Review<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ r.notReady }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"grid-column:span 8;display:flex;gap:24px;align-items:center\">\n              <span style=\"font-size:16px\">{{ r.notReadyText }}<\u002Fspan>\n              <sc-if value=\"{{ r.failed }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ r.retry }}\" style=\"height:40px;padding:0 16px;background:#ffffff;color:#1d1d1f;border:1px solid #1d1d1f;border-radius:999px;font-size:16px;cursor:pointer;transition:background 200ms ease-out,transform 200ms ease-out\" style-hover=\"background:#f5f5f7\" style-active=\"transform:scale(0.98)\">Retry scoring<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- MARKET REVIEW -->\n<sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"05 Market review\" style=\"max-width:1200px;width:100%;margin:0 auto;padding:64px 48px 128px;display:grid;gap:64px\">\n  <div style=\"display:grid;gap:24px\">\n    <div style=\"display:flex;gap:32px;align-items:baseline\">\n      <button sc-camel-on-click=\"{{ goCampaign }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Campaign<\u002Fbutton>\n      <sc-for list=\"{{ reviewTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ t.go }}\" style=\"background:none;border:0;padding:0;font-size:16px;color:#1d1d1f;cursor:pointer;text-decoration:{{ t.deco }};text-underline-offset:6px\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-f
